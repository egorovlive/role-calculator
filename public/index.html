<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-label="Калькулятор">
      <section class="auth-panel" id="authPanel" aria-label="Вход">
        <h1>Калькулятор</h1>
        <form class="login-form" id="loginForm">
          <label>
            Логин
            <input id="username" name="username" type="text" autocomplete="username" required>
          </label>
          <label>
            Пароль
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <p class="login-error" id="loginError" role="alert"></p>
          <button class="login-button" type="submit">Войти</button>
        </form>
      </section>

      <section class="calculator hidden" id="calculator" aria-label="Калькулятор">
        <header class="user-bar">
          <div>
            <span class="user-name" id="currentUser"></span>
            <span class="user-role" id="currentRole"></span>
          </div>
          <button class="logout-button" type="button" id="logoutButton">Выйти</button>
        </header>

        <div class="screen" aria-live="polite">
          <div class="expression" id="expression"></div>
          <output class="display" id="display">0</output>
        </div>

        <div class="keys">
          <button class="key utility" type="button" data-action="clear">C</button>
          <button class="key utility" type="button" data-action="delete">⌫</button>
          <button class="key operator" type="button" data-operator="/">÷</button>
          <button class="key operator" type="button" data-operator="*">×</button>

          <button class="key" type="button" data-number="7">7</button>
          <button class="key" type="button" data-number="8">8</button>
          <button class="key" type="button" data-number="9">9</button>
          <button class="key operator" type="button" data-operator="-">−</button>

          <button class="key" type="button" data-number="4">4</button>
          <button class="key" type="button" data-number="5">5</button>
          <button class="key" type="button" data-number="6">6</button>
          <button class="key operator" type="button" data-operator="+">+</button>

          <button class="key" type="button" data-number="1">1</button>
          <button class="key" type="button" data-number="2">2</button>
          <button class="key" type="button" data-number="3">3</button>
          <button class="key equals" type="button" data-action="calculate">=</button>

          <button class="key zero" type="button" data-number="0">0</button>
          <button class="key" type="button" data-number=".">.</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
