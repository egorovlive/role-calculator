<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Калькулятор</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #eef2f3;
      }

      main {
        width: min(100%, 420px);
        padding: 20px;
        border: 1px solid #d7dee2;
        border-radius: 8px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.45rem;
      }

      p {
        margin: 0 0 14px;
        line-height: 1.5;
      }

      a {
        color: #2563eb;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Калькулятор теперь запускается через сервер</h1>
      <p>Запусти <code>node server.js</code> и открой приложение по адресу:</p>
      <p><a href="http://localhost:3000">http://localhost:3000</a></p>
    </main>
  </body>
</html>
